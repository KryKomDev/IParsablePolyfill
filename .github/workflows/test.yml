name: Test IParsablePolyfill

on:
  push:
    branches:
      - main
    paths:
      - 'IParsablePolyfill/**'
      - 'Sample.cs'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'IParsablePolyfill/**'
      - 'Sample.cs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest
    
    env:
      SolutionName: ./IParsablePolyfill.slnx
      ProjectPath: ./IParsablePolyfill/IParsablePolyfill.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SolutionName }} --ignore-failed-sources

      - name: Build project
        run: dotnet build ${{ env.ProjectPath }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Run Sample Verification
        run: dotnet run Sample.cs --configuration ${{ matrix.configuration }}

      - name: Verify Package Pack
        run: dotnet pack ${{ env.ProjectPath }} --configuration ${{ matrix.configuration }} --no-build